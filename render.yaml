services:
  - type: web
    name: employee-leave-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: employee-leave-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: employee-leave-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: employee-leave-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: employee-leave-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: employee-leave-db
          property: password
      - key: APP_SEED_DEMO_DATA
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: employee-leave-db
    databaseName: employee_leave_db
    user: employee_leave_app
    plan: free